limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=convert_limit:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=convert_conn:10m;

server_tokens off;

# Behind a reverse proxy, rate-limit the real client instead of the proxy
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # connect-src allows https: for deployments that set VITE_API_URL
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /convert {
        # Checked before the upload is read, so anonymous clients cannot push files
        auth_request /_auth_verify;
        limit_req zone=convert_limit burst=10 nodelay;
        limit_req_status 429;
        limit_conn convert_conn 4;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/convert;
        proxy_http_version 1.1;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth_verify {
        internal;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/auth/verify;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
